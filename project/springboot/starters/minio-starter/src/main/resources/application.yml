
spring:
  datasource:

#============ oss：minIO
minio:
  endpoint: "http://127.0.0.1:9000" # minIO 服务器地址
  access-key: "minioadmin"  # minIO 用户名
  secret-key: "minioadmin"  # minIO 密码
  #============ minio 代理（use-gateway-proxy 与 use-nginx-proxy 二选一；若均为 true 则按 nginx）
  # nginx：外链 host=本机局域网 IP，port=endpoint 中的端口；gateway-port/minio-url 仅 Spring Cloud Gateway
  use-gateway-proxy: true
  use-nginx-proxy: false
  gateway-port: 8888
  minio-url: "/oss-minio"


#-------------------------Mybatis-plus setting-------------------------

mybatis-plus:
  type-aliases-package: com.minio.domain.entity # 扫描实体类
  mapper-locations: classpath*:mybatis/*Mapper.xml, classpath*:mybatis-plus/*Mapper.xml #指定多个 Mapper XML 文件的路径
  global-config:
    db-config:
      id-type: auto # 数据库主键策略配置
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# logging

logging:
  level:
    org:
      mybatis: DEBUG