worker_processes  1;

error_log  logs/error.log info;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;

        application live {
            live on;
        }
		
        application hls {
            live on;
            hls on;  
            hls_path temp/hls;  
            hls_fragment 8s;  
        }
    }
}

http {
    # ========== 原有流媒体服务（保留） ==========
    server {
        listen      8080;
		
        location / {
            root html;
        }
		
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root html;
        }
		
        location /hls {  
            #server hls fragments  
            types{  
                application/vnd.apple.mpegurl m3u8;  
                video/mp2t ts;  
            }  
            alias temp/hls;  
            expires -1;  
        }  
    }

    # ========== 新增 MinIO 反向代理 ==========
    server {
        listen       80;                     # 对外暴露的端口，可根据需要修改
        server_name  _;                      # 匹配所有域名/IP，也可指定具体域名

        # 最大上传文件大小（MinIO 默认不限，可根据需求调整）
        client_max_body_size 0;              # 0 表示不限制

        # 代理 WebSocket（MinIO Console 需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 关键：传递正确的 Host 头，保证 MinIO 签名验证通过
        proxy_set_header Host $host;

        # 传递真实客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓冲以支持实时流式传输（MinIO 上传/下载大文件）
        proxy_buffering off;

        location / {
            proxy_pass http://127.0.0.1:9000;   # 转发到本地 MinIO 服务
        }
    }
}