services:
  mysql:
    image: mysql:8.0.42
    container_name: springboot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: vector_demo
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ../db/vector_demo.sql:/docker-entrypoint-initdb.d/02-vector_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: springboot-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  springboot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: springboot-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ALI_API_KEY: ${ALI_API_KEY:-test-key}
      APP_DOCKER_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vector_demo?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_GATEWAY_PROXY: "false"
      MINIO_USE_NGINX_PROXY: "true"
      MINIO_NGINX_PUBLIC_PORT: "80"
      MINIO_NGINX_PUBLIC_HOST: "${MINIO_NGINX_PUBLIC_HOST:-192.168.1.3}"
      MINIO_MINIO_URL: /oss-minio
    ports:
      - "48888:48888"

  nginx:
    image: alfg/nginx-rtmp:latest
    container_name: springboot-nginx
    restart: unless-stopped
    command: ["nginx", "-c", "/etc/nginx/nginx.conf"]
    depends_on:
      - springboot
      - minio
    ports:
      - "80:80"
      - "8080:8080"
      - "1935:1935"
    volumes:
      - ../nginx-docker/conf/nginx.conf:/etc/nginx/nginx.conf
      - ../nginx-docker/conf/mime.types:/etc/nginx/mime.types:ro
      - ../nginx-docker/html:/etc/nginx/html:ro
      - nginx-hls:/tmp/hls

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: springboot-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"

  coturn:
    image: instrumentisto/coturn:latest
    container_name: springboot-coturn
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-magic-vector.local}
      - --lt-cred-mech
      - --user=${TURN_USER:-webrtc}:${TURN_PASSWORD:-webrtc123}
      - --fingerprint
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  mysql-data:
  minio-data:
  nginx-hls:
