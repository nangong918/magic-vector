services:
  mysql:
    image: mysql:8.0.42
    container_name: springboot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: vector_demo
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../db/create_vector_demo_db.sql:/docker-entrypoint-initdb.d/01-create_vector_demo_db.sql:ro
      - ../db/vector_demo.sql:/docker-entrypoint-initdb.d/02-vector_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: springboot-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  springboot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: springboot-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      ALI_API_KEY: ${ALI_API_KEY:-}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vector_demo?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_GATEWAY_PROXY: "false"
      MINIO_USE_NGINX_PROXY: "true"
      MINIO_NGINX_PUBLIC_PORT: "80"
      MINIO_MINIO_URL: /oss-minio
    ports:
      - "48888:48888"

  nginx:
    image: nginx:1.27-alpine
    container_name: springboot-nginx
    restart: unless-stopped
    depends_on:
      - springboot
      - minio
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  minio-data:
