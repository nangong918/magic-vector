# 关闭守护进程模式（Docker 中必须开启，让 Nginx 运行在前台）
daemon off;

# 错误日志输出到控制台（Docker 日志收集）
error_log /dev/stdout info;

# 事件模块（连接数配置）
events {
    # 每个 worker 进程最大 1024 个连接
    worker_connections 1024;
}

# RTMP 直播模块（推流 + 转码 + 分发）
rtmp {
    server {
        # 监听 RTMP 默认端口 1935
        listen 1935;
        chunk_size 4000;

        # 推流应用：客户端往这里推流
        application stream {
            live on; # 开启直播模式

            # 收到流后，自动调用 ffmpeg 转码成 5 种清晰度
            # 源：rtmp://localhost:1935/stream/流名
            exec ffmpeg -i rtmp://localhost:1935/stream/$name
              # 720P 高码率
              -c:a libfdk_aac -b:a 128k -c:v libx264 -b:v 2500k -f flv -g 30 -r 30 -s 1280x720 -preset superfast -profile:v baseline rtmp://localhost:1935/hls/$name_720p2628kbs
              # 480P
              -c:a libfdk_aac -b:a 128k -c:v libx264 -b:v 1000k -f flv -g 30 -r 30 -s 854x480 -preset superfast -profile:v baseline rtmp://localhost:1935/hls/$name_480p1128kbs
              # 360P
              -c:a libfdk_aac -b:a 128k -c:v libx264 -b:v 750k -f flv -g 30 -r 30 -s 640x360 -preset superfast -profile:v baseline rtmp://localhost:1935/hls/$name_360p878kbs
              # 240P 标准
              -c:a libfdk_aac -b:a 400k -f flv -g 30 -r 30 -s 426x240 -preset superfast -profile:v baseline rtmp://localhost:1935/hls/$name_240p528kbs
              # 240P 低码率（弱网）
              -c:a libfdk_aac -b:a 64k -c:v libx264 -b:v 200k -f flv -g 15 -r 15 -s 426x240 -preset superfast -profile:v baseline rtmp://localhost:1935/hls/$name_240p264kbs;
        }

        # HLS 播放应用：转码后的流输出成 m3u8 切片
        application hls {
            live on;
            hls on; # 开启 HLS 切片
            hls_fragment_naming system; # 切片命名方式
            hls_fragment 5; # 每个切片 5 秒
            hls_playlist_length 10; # 播放列表长度 10 秒
            hls_path /tmp/hls; # 切片文件存放目录
            hls_nested on; # 按流名创建子目录

            # 5 种清晰度的自适应码率（HLS 多码率）
            hls_variant _720p2628kbs BANDWIDTH=2628000,RESOLUTION=1280x720;
            hls_variant _480p1128kbs BANDWIDTH=1128000,RESOLUTION=854x480;
            hls_variant _360p878kbs BANDWIDTH=878000,RESOLUTION=640x360;
            hls_variant _240p528kbs BANDWIDTH=528000,RESOLUTION=426x240;
            hls_variant _240p264kbs BANDWIDTH=264000,RESOLUTION=426x240;
        }
    }
}

# HTTP 服务（提供 HLS 播放、状态页、代理）
http {
    sendfile off;
    tcp_nopush on;
    server_tokens off;
    access_log /dev/stdout combined; # 访问日志输出到控制台

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ----------------------
    # 8080 端口：直播状态 + HLS 播放
    # ----------------------
    server {
        listen 8080;
        root /etc/nginx/html;

        # HLS 播放地址：http://ip:8080/hls/流名.m3u8
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            alias /tmp/hls/;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *; # 跨域
        }

        # 直播状态监控：http://ip:8080/stat
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /etc/nginx/html;
        }

        location /crossdomain.xml {
            default_type text/xml;
            expires 24h;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # ----------------------
    # 80 端口：MinIO 存储代理 + WebSocket 代理
    # ----------------------
    server {
        listen 80;
        server_name _;

        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # ----------------------
        # WebSocket 代理（你之前的 webrtc 信令）
        # 把 ws://ip/ws/ 转发到 springboot:48888/ws/
        # ----------------------
        location /ws/ {
            proxy_pass http://springboot:48888/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 其他请求代理到 MinIO 对象存储
        location / {
            proxy_pass http://minio:9000;
        }
    }
}