name: flutter3_app
description: 跨Android, IOS, 鸿蒙的AppDemo

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.6 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # 网络相关 - 完全适配Dart 2.19.6
  dio: ^4.0.6
  retrofit: ^3.3.1
  web_socket_channel: ^2.4.0

  # 序列化（对应Gson）
  json_annotation: ^4.8.1

  # 音频采集 + 加密签名
  record: ^5.0.4
  crypto: ^3.0.2

  # 状态管理（对应ViewModel+LiveData）
  # provider: ^6.0.5
  riverpod: ^2.3.6        # 更现代的选择，推荐新项目使用 (异步)
  # get: ^4.6.5             # 如果喜欢GetX的简洁

  # 工具类
  flutter_easyloading: ^3.0.5
  connectivity_plus: ^4.0.1

  # 错误处理
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

  # 代码生成工具 - 全量降级到Dart 2.19.6兼容版本
  build_runner: ^2.3.3       # 降级到支持Dart 2.x的最后稳定版本
  retrofit_generator: ^4.0.1 # 适配retrofit 3.3.1
  json_serializable: ^6.1.6  # 适配Dart 2.x的序列化生成器

flutter:
  uses-material-design: true