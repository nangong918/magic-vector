# 应用图标配置  生成logo: flutter pub run flutter_launcher_icons
                      # dart pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/ic_launcher_foreground.webp"
  min_sdk_android: 21  # Android最低版本
  # 如果需要自适应图标（Android 8.0+）
  adaptive_icon_background: "#ffffff"  # 自适应图标背景色
  adaptive_icon_foreground: "assets/images/ic_launcher_foreground.webp"  # 自适应图标前景
  # iOS配置
  remove_alpha_ios: true  # iOS图标不能有透明度

