plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.demo.aarlib'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    aaptOptions {
        noCompress "onnx", "tflite"
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    api project(':LocalRepo:AIKit')
    api project(':LocalRepo:SileroVad')
    api project(':LocalRepo:WebRTCVad')
    api project(':LocalRepo:YamnetVad')
    api 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
    api 'org.tensorflow:tensorflow-lite-task-audio:0.4.4'
}
