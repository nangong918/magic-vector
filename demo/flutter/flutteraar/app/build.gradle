plugins {
    alias(libs.plugins.android.application)
}

def sharedModuleKeySource = file("../../flutternew/assets/module_key.json")
def generatedModuleKeyAssetsDir = layout.buildDirectory.dir("generated/moduleKeyAssets/main")

tasks.register("syncSharedModuleKey", Copy) {
    if (!sharedModuleKeySource.exists()) {
        throw new RuntimeException("未找到共享配置文件: ${sharedModuleKeySource.absolutePath}")
    }
    from(sharedModuleKeySource)
    into(generatedModuleKeyAssetsDir)
}

android {
    namespace 'com.example.flutteraar'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.flutteraar"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    aaptOptions {
        noCompress "onnx", "tflite"
    }

    sourceSets {
        main {
            assets.srcDir(generatedModuleKeyAssetsDir)
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncSharedModuleKey")
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.media3.exoplayer
    implementation libs.media3.exoplayer.hls
    implementation libs.media3.exoplayer.rtsp
    implementation libs.media3.datasource.rtmp
    implementation libs.media3.ui
    implementation libs.work.runtime
    implementation libs.okhttp
    implementation libs.webrtc.android
    implementation project(':aarlib')

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    api project(':LocalRepo:AIKit')
    api project(':LocalRepo:SileroVad')
    api project(':LocalRepo:WebRTCVad')
    api project(':LocalRepo:YamnetVad')
}