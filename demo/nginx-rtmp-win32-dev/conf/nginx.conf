worker_processes  1;

error_log  logs/error.log info;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;

        application live {
            live on;
        }
		
        application hls {
            live on;
            hls on;  
            hls_path temp/hls;  
            hls_fragment 8s;  
        }
    }
}

http {
    # ========== 原有流媒体服务（保留） ==========
    server {
        listen      8080;
		
        location / {
            root html;
        }
		
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root html;
        }
		
        location /hls {  
            #server hls fragments  
            types{  
                application/vnd.apple.mpegurl m3u8;  
                video/mp2t ts;  
            }  
            alias temp/hls;  
            expires -1;  
        }  
    }

    # ========== MinIO 反向代理（对外隐藏 9000，统一走 80） ==========
    server {
        listen       80;
        server_name  _;

        # 最大上传文件大小（MinIO 默认不限，可根据需求调整）
        client_max_body_size 0;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 关键：签名是按 127.0.0.1:9000 生成的，转发给 MinIO 时必须使用同样的 Host
        proxy_set_header Host 127.0.0.1:9000;

        # 传递真实客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓冲以支持实时流式传输
        proxy_buffering off;

        location / {
            proxy_pass http://127.0.0.1:9000;
        }
    }
}